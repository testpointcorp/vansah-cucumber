name: 'Vansah Cucumber Reporter'
description: 'Upload Cucumber test results to Vansah Test Management for Jira'
author: 'Testpoint'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  token:
    description: 'Vansah API token'
    required: true
  project:
    description: 'Jira project key (e.g., PROJ)'
    required: true
  report-path:
    description: 'Path to Cucumber JSON report'
    required: true
    default: 'target/cucumber-report.json'
  test-folder:
    description: 'Test folder path in Vansah (e.g., Automation/Cucumber)'
    required: false
  jira-issue:
    description: 'Jira issue key to link test results'
    required: false
  advanced-test-plan:
    description: 'Advanced Test Plan key'
    required: false
  standard-test-plan:
    description: 'Standard Test Plan key'
    required: false
  sprint:
    description: 'Sprint name for test runs'
    required: false
  release:
    description: 'Release/version name'
    required: false
  environment:
    description: 'Environment name (e.g., UAT, PROD)'
    required: false
  step-level:
    description: 'Enable step-level reporting'
    required: false
    default: 'false'
  api-url:
    description: 'Vansah API URL'
    required: false
    default: 'https://prodau.vansah.com'

outputs:
  imported:
    description: 'Number of test cases imported'
  failed:
    description: 'Number of test cases that failed to import'
  test-runs:
    description: 'JSON array of created test run IDs'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm ci --production
    
    - name: Run Vansah Import
      shell: bash
      env:
        VANSAH_TOKEN: ${{ inputs.token }}
      run: |
        ARGS=(
          --report "${{ inputs.report-path }}"
          --token "$VANSAH_TOKEN"
          --project "${{ inputs.project }}"
          --api-url "${{ inputs.api-url }}"
        )
        
        [[ -n "${{ inputs.test-folder }}" ]] && ARGS+=(--folder "${{ inputs.test-folder }}")
        [[ -n "${{ inputs.jira-issue }}" ]] && ARGS+=(--issue "${{ inputs.jira-issue }}")
        [[ -n "${{ inputs.advanced-test-plan }}" ]] && ARGS+=(--atp "${{ inputs.advanced-test-plan }}")
        [[ -n "${{ inputs.standard-test-plan }}" ]] && ARGS+=(--stp "${{ inputs.standard-test-plan }}")
        [[ -n "${{ inputs.sprint }}" ]] && ARGS+=(--sprint "${{ inputs.sprint }}")
        [[ -n "${{ inputs.release }}" ]] && ARGS+=(--release "${{ inputs.release }}")
        [[ -n "${{ inputs.environment }}" ]] && ARGS+=(--environment "${{ inputs.environment }}")
        [[ "${{ inputs.step-level }}" == "true" ]] && ARGS+=(--step-level)
        
        node ${{ github.action_path }}/cli/src/cli.js "${ARGS[@]}"

